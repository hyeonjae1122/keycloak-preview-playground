{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Values.keycloak.namespace }}
spec:
  type: {{ .Values.keycloak.service.type }}
  selector:
    app: keycloak
  ports:
  - port: {{ .Values.keycloak.service.port }}
    targetPort: {{ .Values.keycloak.service.targetPort }}
    {{- if .Values.keycloak.service.nodePort }}
    nodePort: {{ .Values.keycloak.service.nodePort }}
    {{- end }}
    name: http
{{- end }}
